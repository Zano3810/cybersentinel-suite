name: cybersentinel_suite
description: CyberSentinel Suite - 5 Tab - com.cybersentinel.app
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  local_auth: ^2.1.7
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3
  http: ^1.1.2
  connectivity_plus: ^5.0.2
  network_info_plus: ^5.0.2
  nfc_manager: ^3.3.0
  sensors_plus: ^5.0.1
  battery_plus: ^5.0.2
  device_info_plus: ^9.1.2
  permission_handler: ^11.0.1
  path_provider: ^2.1.1
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^7.2.2
  cross_file: ^0.3.3+2
  shelf: ^1.4.1
  shelf_static: ^1.1.2
  shelf_router: ^1.1.3
  mime: ^1.0.5
  mobile_scanner: ^3.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
